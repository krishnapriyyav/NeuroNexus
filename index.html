<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Form</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #e0f2fe; /* Page background: light blue */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .form-container {
      background-color: #ffffff; /* Form background: white */
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #1e293b;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
      color: #1e293b;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #94a3b8;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
    }

    .radio-group {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    input[type="submit"] {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background-color: #3b82f6; /* Original blue */
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #1d4ed8; /* Darker blue on hover */
    }
  </style>
</head>
<body>
  <form class="form-container" novalidate>
    <h2>Contact Form</h2>

    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname" required />

    <label for="phone">Contact Number</label>
    <input type="tel" id="phone" name="phone" pattern="[0-9]{10,15}" inputmode="numeric" required placeholder="Enter digits only" />

    <label for="address">Address</label>
    <textarea id="address" name="address" required></textarea>

    <label for="company">Company Name</label>
    <input type="text" id="company" name="company" required />

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required />

    <label for="department">Department</label>
    <select id="department" name="department" required>
      <option value="">--Select Department--</option>
      <option value="HR">HR</option>
      <option value="Sales">Sales</option>
      <option value="Development">Development</option>
      <option value="Marketing">Marketing</option>
      <option value="Others">Others</option>
    </select>

    <label>Gender</label>
    <div class="radio-group">
      <label><input type="radio" name="gender" value="Male" required /> Male</label>
      <label><input type="radio" name="gender" value="Female" /> Female</label>
      <label><input type="radio" name="gender" value="Prefer not to say" /> Prefer not to say</label>
    </div>

    <input type="submit" value="Submit" />
  </form>
</body>
</html>
